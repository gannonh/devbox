name: Vercel provider UAT

# This is the credentialed, owner-triggered end-to-end gate. The UAT runners
# are checked into the repository, so every run exercises the same reviewed
# provider and relay-backed public-app contract without per-run commands.
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      image_reference:
        description: 'Fully-qualified digest reference to exercise'
        required: true
        type: string
      path:
        required: false
        type: string
        default: both
    secrets:
      VERCEL_CONSUMER_TOKEN:
        required: true
      VERCEL_CONSUMER_TEAM_ID:
        required: true
      VERCEL_CONSUMER_PROJECT_ID:
        required: true
      DEVBOX_GITHUB_FIXTURE_TOKEN:
        required: true
      DEVBOX_GITHUB_FIXTURE_REPOSITORY:
        required: true
      DEVBOX_GITHUB_FIXTURE_BRANCH:
        required: true
      DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH:
        required: true
      DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE:
        required: true
      DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT:
        required: true
  workflow_dispatch:
    inputs:
      image_reference:
        description: 'Fully-qualified digest reference to exercise (e.g. vcr.vercel.com/<team>/<project>/devbox@sha256:...)'
        required: true
        type: string
      source_sha:
        description: 'Exact 40-character source SHA; empty uses the checked-out commit'
        required: false
        type: string
      path:
        description: 'Provider smoke path mode'
        required: false
        default: both
        type: choice
        options: [both]

permissions:
  contents: read

concurrency:
  group: vercel-provider-gates
  cancel-in-progress: false

jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: vercel-provider-smoke
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.event.inputs.source_sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
      SMOKE_PATH: ${{ inputs.path || github.event.inputs.path || 'both' }}
      SMOKE_TIMEOUT_MS: '720000'
      SMOKE_UAT_TIMEOUT_MS: '720000'
      SMOKE_TOTAL_TIMEOUT_MS: '3300000'
      SMOKE_OPERATION_TIMEOUT_MS: '30000'
      SMOKE_COMMAND_TIMEOUT_MS: '60000'
      SMOKE_TERMINAL_TIMEOUT_MS: '90000'
      SMOKE_CLEANUP_TIMEOUT_MS: '120000'
      SMOKE_GITHUB_TIMEOUT_MS: '10000'
      DEVBOX_UAT_REQUIRED: 'true'
    steps:
      - name: Guard default-branch UAT
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[a-f0-9]{40}$ ]] || {
            echo 'SOURCE_SHA must be a full lowercase commit SHA' >&2
            exit 1
          }
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            test "${GITHUB_REF_NAME}" = "${SOURCE_BRANCH}" || {
              echo 'manual UAT runs must use the repository default branch' >&2
              exit 1
            }
          fi

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      # Manual dispatch may pin any SOURCE_SHA, so after checkout verify it is
      # the current default-branch head before any secret-bearing step runs.
      # The full-history checkout leaves refs/remotes/origin/<default> present.
      - name: Verify manual UAT source is the default-branch head
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          default_head="$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")"
          test "${default_head}" = "${SOURCE_SHA}" || {
            echo 'manual UAT source SHA must match the current default-branch head' >&2
            exit 1
          }

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production adapters
        run: npm run build

      - name: Prepare evidence directory
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/vercel-provider-uat"
          mkdir -p "${artifact_dir}"
          checked_out_sha="$(git rev-parse HEAD)"
          test "${checked_out_sha}" = "${SOURCE_SHA}"
          echo "ARTIFACT_DIR=${artifact_dir}" >> "${GITHUB_ENV}"
          printf '{"schemaVersion":1,"workflow":"vercel-provider-uat","sourceSha":"%s","redacted":false}\n' \
            "${checked_out_sha}" > "${artifact_dir}/invocation.json"

      # This path proves private source creation, a fresh branch, an interactive
      # terminal, stop/resume, runtime secret refresh, authenticated push, and
      # final Sandbox/snapshot/branch removal.
      - name: Run private-repository provider UAT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
          DEVBOX_GITHUB_FIXTURE_TOKEN: ${{ secrets.DEVBOX_GITHUB_FIXTURE_TOKEN }}
          DEVBOX_GITHUB_FIXTURE_REPOSITORY: ${{ secrets.DEVBOX_GITHUB_FIXTURE_REPOSITORY }}
          DEVBOX_GITHUB_FIXTURE_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_BRANCH }}
          DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH }}
          DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE }}
          DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT }}
          SMOKE_REPORT: ${{ env.ARTIFACT_DIR }}/provider-uat.json
          DEVBOX_VERCEL_IMAGE: ${{ inputs.image_reference }}
        run: node scripts/vercel/provider-smoke.mjs

      # This path uses the exact pinned public fixture for issue #17. The
      # runner creates only the display route first, then proves that the
      # logical Vite port is served through a relay, including browser HMR,
      # attach, compensation, the live route limit, and cleanup.
      - name: Prepare pinned app-route UAT source
        env:
          GH_TOKEN: ${{ secrets.DEVBOX_GITHUB_FIXTURE_TOKEN }}
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/devbox-uat-source"
          gh repo clone gannonh/uat-devbox "${source_root}" -- --branch main --single-branch
          git -C "${source_root}" checkout --detach 180442037b52775618b2d56cdf7f218514aa9b00
          test "$(git -C "${source_root}" rev-parse HEAD)" = 180442037b52775618b2d56cdf7f218514aa9b00
          echo "DEVBOX_UAT_REPO_ROOT=${source_root}" >> "${GITHUB_ENV}"

      - name: Run relay-backed public app-route UAT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.DEVBOX_GITHUB_FIXTURE_TOKEN }}
          DEVBOX_UAT_REPO_KEY: gannonh/uat-devbox
          DEVBOX_UAT_MONOREPO_BRANCH: main
          DEVBOX_UAT_ONLY: monorepo
          DEVBOX_UAT_REPORT: ${{ env.ARTIFACT_DIR }}/app-port-uat.json
          DEVBOX_VERCEL_IMAGE: ${{ inputs.image_reference }}
        run: node scripts/vercel/app-port-uat.mjs

      # This independent image path proves all four agents, Chromium, the
      # access-code pairing HTTP/WebSocket boundary, and the 6080-only public
      # display policy (VNC 5900 and internal 6081 are never forwarded).
      - name: Run display, agent, and port UAT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
          SMOKE_ROLE: consumer
          SMOKE_REPORT: ${{ env.ARTIFACT_DIR }}/display-uat.json
          DEVBOX_VERCEL_IMAGE: ${{ inputs.image_reference }}
        run: |
          set -euo pipefail
          # The caller names the image; the pin is a build output, not source.
          image_ref="${DEVBOX_VERCEL_IMAGE}"
          image_digest="${image_ref##*@}"
          IMAGE_REF="${image_ref}" EXPECTED_IMAGE_DIGEST="${image_digest}" \
            VERCEL_TOKEN="${VERCEL_TOKEN}" VERCEL_TEAM_ID="${VERCEL_TEAM_ID}" \
            VERCEL_PROJECT_ID="${VERCEL_PROJECT_ID}" SMOKE_ROLE=consumer \
            SMOKE_REPORT="${SMOKE_REPORT}" node scripts/vercel/smoke-sandbox.mjs

      - name: Redact all UAT evidence
        id: redact
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
          DEVBOX_GITHUB_FIXTURE_TOKEN: ${{ secrets.DEVBOX_GITHUB_FIXTURE_TOKEN }}
          DEVBOX_GITHUB_FIXTURE_REPOSITORY: ${{ secrets.DEVBOX_GITHUB_FIXTURE_REPOSITORY }}
          DEVBOX_GITHUB_FIXTURE_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_BRANCH }}
          DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH }}
          DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE }}
          DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT }}
        run: node scripts/vercel/redact-artifacts.mjs "${ARTIFACT_DIR}"

      - name: Upload redacted UAT evidence
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-provider-uat-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14
