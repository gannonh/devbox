name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

jobs:
  quality:
    name: quality and provider contracts (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the supported floor exact and exercise the current supported
        # release without repeating the expensive build/full-test lane.
        node-version: ['20.18.1', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Provider and smoke workflow contracts
        if: matrix.node-version == '24'
        run: >-
          npm test -- --run
          tests/provider-registry.test.ts
          tests/cli-provider-routing.test.ts
          tests/vercel-auth.test.ts
          tests/vercel-provider-smoke.test.ts
          tests/vercel-smoke-evidence.test.ts
          tests/vercel-smoke-terminal.test.ts
          tests/vercel-workflow.test.ts

      - name: Build
        if: matrix.node-version == '20.18.1'
        run: npm run build

      - name: Full test suite
        if: matrix.node-version == '20.18.1'
        run: npm run test

  vercel-image-candidate:
    name: credentialed Vercel image candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == format('vcr:{0}', github.event.pull_request.head.sha)
    # Reusable-workflow permission ceilings must cover every called job. The
    # called candidate job explicitly downgrades itself to contents: read, and
    # its write-capable promotion job is structurally excluded on PR events.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/vercel-image.yml
    secrets:
      VERCEL_PUBLISHER_TOKEN: ${{ secrets.VERCEL_PUBLISHER_TOKEN }}
      VERCEL_PUBLISHER_TEAM_ID: ${{ secrets.VERCEL_PUBLISHER_TEAM_ID }}
      VERCEL_PUBLISHER_PROJECT_ID: ${{ secrets.VERCEL_PUBLISHER_PROJECT_ID }}
      VERCEL_PUBLISHER_TEAM_SLUG: ${{ secrets.VERCEL_PUBLISHER_TEAM_SLUG }}
      VERCEL_PUBLISHER_PROJECT_SLUG: ${{ secrets.VERCEL_PUBLISHER_PROJECT_SLUG }}
      VERCEL_CONSUMER_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
      VERCEL_CONSUMER_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
      VERCEL_CONSUMER_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
      VERCEL_CONSUMER_TEAM_SLUG: ${{ secrets.VERCEL_CONSUMER_TEAM_SLUG }}
      VERCEL_CONSUMER_PROJECT_SLUG: ${{ secrets.VERCEL_CONSUMER_PROJECT_SLUG }}

  vercel-provider-smoke:
    name: credentialed Vercel provider terminal smoke
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == format('provider-smoke:{0}', github.event.pull_request.head.sha)
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-provider-smoke.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      path: both
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GITHUB_FIXTURE_TOKEN: ${{ secrets.GITHUB_FIXTURE_TOKEN }}
      GITHUB_FIXTURE_REPOSITORY: ${{ secrets.GITHUB_FIXTURE_REPOSITORY }}
      GITHUB_FIXTURE_BRANCH: ${{ secrets.GITHUB_FIXTURE_BRANCH }}
      GITHUB_FIXTURE_DEFAULT_BRANCH: ${{ secrets.GITHUB_FIXTURE_DEFAULT_BRANCH }}
      GITHUB_FIXTURE_EXPECTED_FILE: ${{ secrets.GITHUB_FIXTURE_EXPECTED_FILE }}
      GITHUB_FIXTURE_EXPECTED_CONTENT: ${{ secrets.GITHUB_FIXTURE_EXPECTED_CONTENT }}
