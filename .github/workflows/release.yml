# Release workflow for @gannonh/devbox.
#
# Single trigger: manual dispatch (workflow_dispatch) with:
#   version:  full semver (e.g. "1.2.0"), or empty for the current nightly's
#             stable base version
#   dry_run:  boolean, default false — run everything except npm publish and
#             the tag/release creation
#
# Publish-first ordering. The git tag and GitHub Release are created ONLY after
# `npm publish` succeeds. A failed publish leaves no tag and no release page,
# so there is no "release" pointing at an unpublished version. Re-runs that find
# the target version already on npm skip republish and only finish tag/release.
# The release tag always points at the commit that produced the published
# tarball. If the default branch moved during the long smoke/UAT/benchmark
# gates, the version manifests are applied as a separate tip commit so the tag
# is not rewritten onto untested intervening changes.
#
# Version resolution:
#   - Resolve the current npm nightly prerelease that supplies the proven pin.
#   - If version input is provided, use it verbatim (strip leading 'v').
#   - If empty, strip the nightly suffix (for example, 1.2.0-nightly.41 becomes
#     stable version 1.2.0).
#
# Tag is the source of truth. CI syncs package.json + package-lock.json version
# to the tag/target, not the other way around. Both manifests are committed so
# re-runs at the same version never hit an empty commit.
#
# NPM_TOKEN is a repository secret configured in GitHub repo settings.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full semver override (e.g. 1.2.0). Empty = stable version of current @nightly.'
        required: false
        type: string
      dry_run:
        description: 'Run everything except npm publish and tag/release creation'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Resolve the digest the nightly channel already proved, and move it to the
  # stable channel.  Retagging is an OCI manifest PUT, so no image is rebuilt
  # and the digest a user installs is byte-identical to the one that was smoked.
  promote-image:
    name: Promote the nightly digest to stable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_reference: ${{ steps.pin.outputs.image_reference }}
      stable_version: ${{ steps.pin.outputs.stable_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The nightly package already carries a pin emitted from validated
      # publisher and consumer evidence. Stable reuses those exact bytes rather
      # than re-deriving a claim from evidence this run does not have.
      - name: Take the pin from the nightly prerelease
        id: pin
        run: |
          set -euo pipefail
          nightly_version="$(npm view @gannonh/devbox dist-tags.nightly)"
          [[ -n "${nightly_version}" ]] || { echo 'no nightly prerelease is available to promote' >&2; exit 1; }
          [[ "${nightly_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-nightly\.[0-9]+$ ]] || {
            echo "current nightly version is malformed: ${nightly_version}" >&2
            exit 1
          }
          stable_version="${BASH_REMATCH[1]}"
          echo "Promoting nightly ${nightly_version} to stable ${stable_version}"
          work="${RUNNER_TEMP}/nightly"
          mkdir -p "${work}"
          ( cd "${work}" && npm pack "@gannonh/devbox@${nightly_version}" >/dev/null && tar -xzf ./*.tgz )
          pin="${work}/package/dist/vercel-image-pin.json"
          [[ -f "${pin}" ]] || { echo "nightly ${nightly_version} carries no image pin" >&2; exit 1; }
          mkdir -p "${RUNNER_TEMP}/pin"
          cp "${pin}" "${RUNNER_TEMP}/pin/vercel-image-pin.json"
          reference="$(node -p "require('${pin}').reference")"
          echo "image_reference=${reference}" >> "${GITHUB_OUTPUT}"
          echo "stable_version=${stable_version}" >> "${GITHUB_OUTPUT}"

      - name: Move the proven digest to the stable channel
        env:
          VERCEL_PUBLISHER_TOKEN: ${{ secrets.VERCEL_PUBLISHER_TOKEN }}
          VERCEL_PUBLISHER_TEAM_ID: ${{ secrets.VERCEL_PUBLISHER_TEAM_ID }}
          IMAGE_REFERENCE: ${{ steps.pin.outputs.image_reference }}
        run: |
          set -euo pipefail
          repository="${IMAGE_REFERENCE%@*}"
          digest="${IMAGE_REFERENCE##*@}"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "nightly pin is not digest-pinned: ${IMAGE_REFERENCE}" >&2
            exit 1
          }
          node scripts/vercel/retag-image.mjs \
            --repository "${repository}" --digest "${digest}" --tag stable

      - name: Upload the pin for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-image-pin-${{ github.run_id }}
          path: ${{ runner.temp }}/pin/vercel-image-pin.json
          retention-days: 7

  vercel-provider-smoke:
    name: Vercel provider terminal smoke gate
    needs: promote-image
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-provider-smoke.yml
    with:
      source_sha: ${{ github.sha }}
      path: both
      image_reference: ${{ needs.promote-image.outputs.image_reference }}
    secrets:
      VERCEL_CONSUMER_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
      VERCEL_CONSUMER_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
      VERCEL_CONSUMER_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
      DEVBOX_GITHUB_FIXTURE_TOKEN: ${{ secrets.DEVBOX_GITHUB_FIXTURE_TOKEN }}
      DEVBOX_GITHUB_FIXTURE_REPOSITORY: ${{ secrets.DEVBOX_GITHUB_FIXTURE_REPOSITORY }}
      DEVBOX_GITHUB_FIXTURE_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_BRANCH }}
      DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH }}
      DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE }}
      DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT }}

  vercel-provider-uat:
    name: Vercel provider UAT gate
    needs: [promote-image, vercel-provider-smoke]
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-provider-uat.yml
    with:
      source_sha: ${{ github.sha }}
      path: both
      image_reference: ${{ needs.promote-image.outputs.image_reference }}
    secrets:
      VERCEL_CONSUMER_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
      VERCEL_CONSUMER_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
      VERCEL_CONSUMER_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
      DEVBOX_GITHUB_FIXTURE_TOKEN: ${{ secrets.DEVBOX_GITHUB_FIXTURE_TOKEN }}
      DEVBOX_GITHUB_FIXTURE_REPOSITORY: ${{ secrets.DEVBOX_GITHUB_FIXTURE_REPOSITORY }}
      DEVBOX_GITHUB_FIXTURE_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_BRANCH }}
      DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH }}
      DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE }}
      DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT }}

  vercel-benchmark:
    name: Vercel five-run benchmark gate
    needs: [promote-image, vercel-provider-uat]
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-benchmark.yml
    with:
      source_sha: ${{ github.sha }}
      image_reference: ${{ needs.promote-image.outputs.image_reference }}
    secrets:
      VERCEL_CONSUMER_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
      VERCEL_CONSUMER_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
      VERCEL_CONSUMER_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}

  release:
    needs: [promote-image, vercel-provider-smoke, vercel-provider-uat, vercel-benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep enough history that the published release commit stays reachable
          # when applying version manifests onto a moved default-branch tip.
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Resolve target version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          DEFAULT_VERSION: ${{ needs.promote-image.outputs.stable_version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            TARGET_VERSION="${INPUT_VERSION#v}"
            echo "Manual dispatch with explicit version: ${TARGET_VERSION}"
          else
            TARGET_VERSION="${DEFAULT_VERSION}"
            echo "Stable version from current nightly: ${TARGET_VERSION}"
          fi
          [[ "${TARGET_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Stable version must be a full semver such as 1.2.0"
            exit 1
          }
          echo "target_version=${TARGET_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Target version: ${TARGET_VERSION}"

      - name: Sync version in package.json + package-lock.json
        run: |
          set -euo pipefail
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"
          # npm version edits package.json AND package-lock.json in place
          # without creating a git tag. Both are committed below so re-runs at
          # the same version never hit an empty-commit failure.
          npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version
          echo "Synced package.json + package-lock.json to $TARGET_VERSION"

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The pin is the nightly's own validated bytes, so the release ships the
      # exact digest that evidence proves.
      - name: Download the promoted image pin
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-image-pin-${{ github.run_id }}
          path: dist

      - name: Validate Vercel image pin
        run: npm run validate:release

      - name: Pack and prove the pin shipped
        id: pack
        run: |
          set -euo pipefail
          # prepack rebuilds, and build starts with `rm -rf dist` -- which would
          # delete the pin emitted above. Pack the already-built tree instead,
          # then prove the pin actually shipped.
          npm pack --ignore-scripts
          tarball="$(ls -1 *.tgz | head -1)"
          # Capture the listing first: piping tar into `grep -q` makes grep exit
          # on the first match, and the resulting SIGPIPE fails the pipeline
          # under pipefail even though the file was found.
          listing="$(tar -tzf "${tarball}")"
          grep -qx 'package/dist/vercel-image-pin.json' <<<"${listing}" || {
            echo "packed tarball ${tarball} carries no image pin" >&2
            exit 1
          }
          packed="$(tar -xzOf "${tarball}" package/dist/vercel-image-pin.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).reference')"
          echo "packed ${tarball} pinned to ${packed}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      # --- Publish ------------------------------------------------------------
      # PUBLISH BEFORE TAG/RELEASE. If this step fails, the tag and GitHub
      # Release are never created, so there is no release pointing at an
      # unpublished version.
      #
      # Re-runs after a partial success (npm published, then git push rejected)
      # must not fail with E403: skip publish when the exact version already
      # exists and only ensure the latest dist-tag points at it.
      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"
          [[ "${GITHUB_REF_NAME}" == "${{ github.event.repository.default_branch }}" ]] || {
            echo 'a stable release may only be cut from the default branch' >&2
            exit 1
          }
          existing="$(npm view "@gannonh/devbox@${TARGET_VERSION}" version 2>/dev/null || true)"
          if [[ "${existing}" == "${TARGET_VERSION}" ]]; then
            echo "@gannonh/devbox@${TARGET_VERSION} already on the registry; ensuring dist-tag latest"
            npm dist-tag add "@gannonh/devbox@${TARGET_VERSION}" latest
          else
            echo "Publishing @gannonh/devbox@$TARGET_VERSION to latest"
            npm publish '${{ steps.pack.outputs.tarball }}' --access public --tag latest
          fi

      # The alias workspace pins @gannonh/devbox exactly, so it is versioned and
      # published here rather than in Nightly: npx @gannonh/dbx resolves latest,
      # and latest only ever moves through stable releases.
      - name: Publish @gannonh/dbx alias
        if: ${{ github.event.inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"
          cd packages/dbx
          npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version
          npm pkg set "dependencies.@gannonh/devbox=$TARGET_VERSION"
          existing="$(npm view "@gannonh/dbx@${TARGET_VERSION}" version 2>/dev/null || true)"
          if [[ "${existing}" == "${TARGET_VERSION}" ]]; then
            echo "@gannonh/dbx@${TARGET_VERSION} already on the registry; ensuring dist-tag latest"
            npm dist-tag add "@gannonh/dbx@${TARGET_VERSION}" latest
          else
            echo "Publishing @gannonh/dbx@$TARGET_VERSION -> @gannonh/devbox@$TARGET_VERSION"
            npm publish --access public --tag latest
          fi

      # --- Commit, tag, and GitHub Release ------------------------------------
      # Only after publish succeeds (or dry_run). Each step gates on the
      # previous step's success() so a publish failure leaves no tag/release.
      - name: Commit version bump and create tag
        id: tag
        if: ${{ success() && github.event.inputs.dry_run != true }}
        run: |
          set -euo pipefail
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # packages/dbx/package.json is rewritten by the alias publish step.
          # Refresh the lockfile so packages/dbx's @gannonh/devbox pin and the
          # node_modules/@gannonh/devbox registry entry match. Without this,
          # the next npm ci on main fails with EUSAGE (lock file still on N-1).
          npm install --package-lock-only --ignore-scripts
          git add package.json package-lock.json packages/dbx/package.json
          if git diff --cached --quiet; then
            echo "Version manifests already at ${TARGET_VERSION}; reusing HEAD for the tag"
          else
            git commit -m "chore(release): v${TARGET_VERSION}"
          fi

          # Tag the tree that produced the published tarball. Do not rebase this
          # commit onto later default-branch tips: intervening changes were not
          # in the packed artifact and were not exercised by this run's gates.
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/v${TARGET_VERSION}" >/dev/null; then
            git tag -d "v${TARGET_VERSION}"
          fi
          git tag "v${TARGET_VERSION}" "${RELEASE_COMMIT}"

          if git ls-remote --exit-code --tags origin "refs/tags/v${TARGET_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${TARGET_VERSION} already on origin"
          else
            git push origin "v${TARGET_VERSION}"
          fi

          git fetch origin "${DEFAULT_BRANCH}"
          if git push origin "${RELEASE_COMMIT}:refs/heads/${DEFAULT_BRANCH}"; then
            echo "Fast-forwarded ${DEFAULT_BRANCH} to release commit ${RELEASE_COMMIT}"
          else
            echo "${DEFAULT_BRANCH} moved during the release gates; applying version manifests onto the current tip without moving the tag"
            git switch --force-create "release-version-bump" "origin/${DEFAULT_BRANCH}"
            git checkout "${RELEASE_COMMIT}" -- package.json package-lock.json packages/dbx/package.json
            git add package.json package-lock.json packages/dbx/package.json
            if git diff --cached --quiet; then
              echo "${DEFAULT_BRANCH} already carries version ${TARGET_VERSION}"
            else
              git commit -m "chore(release): v${TARGET_VERSION}"
              git push origin "HEAD:${DEFAULT_BRANCH}"
            fi
          fi

          echo "Pushed tag v${TARGET_VERSION} at ${RELEASE_COMMIT}"
          echo "tag=v${TARGET_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ success() && github.event.inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"
          if gh release view "v${TARGET_VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${TARGET_VERSION} already exists"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Install

          ```sh
          npx @gannonh/devbox init
          ```

          or

          ```sh
          npm install -g @gannonh/devbox
          devbox init
          ```
          EOF
          gh release create "v${TARGET_VERSION}" \
            --title "v${TARGET_VERSION}" \
            --notes-file /tmp/release-notes.md
          echo "Created GitHub Release v${TARGET_VERSION}"

      - name: Dry-run summary
        if: ${{ github.event.inputs.dry_run == true }}
        run: |
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"
          echo "::notice::Dry run complete. Would have published @gannonh/devbox@$TARGET_VERSION, created tag v${TARGET_VERSION}, and a GitHub Release."
