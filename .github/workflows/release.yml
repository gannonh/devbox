# Release workflow for @gannonh/devbox.
#
# Single trigger: manual dispatch (workflow_dispatch) with:
#   version:  full semver (e.g. "1.2.0"), or empty for patch bump from last tag
#   dry_run:  boolean, default false — run everything except npm publish and
#             the tag/release creation
#
# Publish-first ordering. The git tag and GitHub Release are created ONLY after
# `npm publish` succeeds. A failed publish leaves no tag and no release page,
# so there is no "release" pointing at an unpublished version.
#
# Version resolution:
#   - If version input is provided, use it verbatim (strip leading 'v').
#   - If empty, resolve the last tag via `git tag --list 'v*' --sort=-v:refname | head -1`
#     and patch-bump it.
#   - If no prior tag exists and version is empty, error (first release needs an
#     explicit version).
#
# Tag is the source of truth. CI syncs package.json + package-lock.json version
# to the tag/target, not the other way around. Both manifests are committed so
# re-runs at the same version never hit an empty commit.
#
# NPM_TOKEN is a repository secret configured in GitHub repo settings.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full semver (e.g. 1.2.0). Empty = patch bump from last tag.'
        required: false
        type: string
      nightly_version:
        description: 'Nightly prerelease to promote (e.g. 1.2.0-nightly.41). Empty = current @nightly dist-tag.'
        required: false
        type: string
      dry_run:
        description: 'Run everything except npm publish and tag/release creation'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Resolve the digest the nightly channel already proved, and move it to the
  # stable channel.  Retagging is an OCI manifest PUT, so no image is rebuilt
  # and the digest a user installs is byte-identical to the one that was smoked.
  promote-image:
    name: Promote the nightly digest to stable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_reference: ${{ steps.pin.outputs.image_reference }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The nightly package already carries a pin emitted from validated
      # publisher and consumer evidence. Stable reuses those exact bytes rather
      # than re-deriving a claim from evidence this run does not have.
      - name: Take the pin from the nightly prerelease
        id: pin
        run: |
          set -euo pipefail
          version='${{ github.event.inputs.nightly_version }}'
          [[ -n "${version}" ]] || version="$(npm view @gannonh/devbox dist-tags.nightly)"
          [[ -n "${version}" ]] || { echo 'no nightly prerelease is available to promote' >&2; exit 1; }
          echo "Promoting nightly ${version}"
          work="${RUNNER_TEMP}/nightly"
          mkdir -p "${work}"
          ( cd "${work}" && npm pack "@gannonh/devbox@${version}" >/dev/null && tar -xzf ./*.tgz )
          pin="${work}/package/dist/vercel-image-pin.json"
          [[ -f "${pin}" ]] || { echo "nightly ${version} carries no image pin" >&2; exit 1; }
          mkdir -p "${RUNNER_TEMP}/pin"
          cp "${pin}" "${RUNNER_TEMP}/pin/vercel-image-pin.json"
          reference="$(node -p "require('${pin}').reference")"
          echo "image_reference=${reference}" >> "${GITHUB_OUTPUT}"
          echo "nightly_version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Move the proven digest to the stable channel
        env:
          VERCEL_PUBLISHER_TOKEN: ${{ secrets.VERCEL_PUBLISHER_TOKEN }}
          VERCEL_PUBLISHER_TEAM_ID: ${{ secrets.VERCEL_PUBLISHER_TEAM_ID }}
          IMAGE_REFERENCE: ${{ steps.pin.outputs.image_reference }}
        run: |
          set -euo pipefail
          repository="${IMAGE_REFERENCE%@*}"
          digest="${IMAGE_REFERENCE##*@}"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "nightly pin is not digest-pinned: ${IMAGE_REFERENCE}" >&2
            exit 1
          }
          node scripts/vercel/retag-image.mjs \
            --repository "${repository}" --digest "${digest}" --tag stable

      - name: Upload the pin for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vercel-image-pin-${{ github.run_id }}
          path: ${{ runner.temp }}/pin/vercel-image-pin.json
          retention-days: 7

  vercel-provider-smoke:
    name: Vercel provider terminal smoke gate
    needs: promote-image
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-provider-smoke.yml
    with:
      source_sha: ${{ github.sha }}
      path: both
      image_reference: ${{ needs.promote-image.outputs.image_reference }}
    secrets:
      VERCEL_CONSUMER_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
      VERCEL_CONSUMER_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
      VERCEL_CONSUMER_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
      DEVBOX_GITHUB_FIXTURE_TOKEN: ${{ secrets.DEVBOX_GITHUB_FIXTURE_TOKEN }}
      DEVBOX_GITHUB_FIXTURE_REPOSITORY: ${{ secrets.DEVBOX_GITHUB_FIXTURE_REPOSITORY }}
      DEVBOX_GITHUB_FIXTURE_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_BRANCH }}
      DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH }}
      DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE }}
      DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT }}

  vercel-provider-uat:
    name: Vercel provider UAT gate
    needs: [promote-image, vercel-provider-smoke]
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-provider-uat.yml
    with:
      source_sha: ${{ github.sha }}
      path: both
      image_reference: ${{ needs.promote-image.outputs.image_reference }}
    secrets:
      VERCEL_CONSUMER_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
      VERCEL_CONSUMER_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
      VERCEL_CONSUMER_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
      DEVBOX_GITHUB_FIXTURE_TOKEN: ${{ secrets.DEVBOX_GITHUB_FIXTURE_TOKEN }}
      DEVBOX_GITHUB_FIXTURE_REPOSITORY: ${{ secrets.DEVBOX_GITHUB_FIXTURE_REPOSITORY }}
      DEVBOX_GITHUB_FIXTURE_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_BRANCH }}
      DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH: ${{ secrets.DEVBOX_GITHUB_FIXTURE_DEFAULT_BRANCH }}
      DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_FILE }}
      DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT: ${{ secrets.DEVBOX_GITHUB_FIXTURE_EXPECTED_CONTENT }}

  vercel-benchmark:
    name: Vercel five-run benchmark gate
    needs: [promote-image, vercel-provider-uat]
    permissions:
      contents: read
    uses: ./.github/workflows/vercel-benchmark.yml
    with:
      source_sha: ${{ github.sha }}
      image_reference: ${{ needs.promote-image.outputs.image_reference }}
    secrets:
      VERCEL_CONSUMER_TOKEN: ${{ secrets.VERCEL_CONSUMER_TOKEN }}
      VERCEL_CONSUMER_TEAM_ID: ${{ secrets.VERCEL_CONSUMER_TEAM_ID }}
      VERCEL_CONSUMER_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}

  release:
    needs: [promote-image, vercel-provider-smoke, vercel-provider-uat, vercel-benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # need full history + tags for version resolution

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Resolve target version
        id: version
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            # Explicit version: strip leading 'v' if present.
            TARGET_VERSION="${INPUT_VERSION#v}"
            echo "Manual dispatch with explicit version: $TARGET_VERSION"
          else
            # Empty version: patch-bump from last tag.
            LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
            if [ -z "$LAST_TAG" ]; then
              echo "::error::No prior tag found. Provide an explicit version for the first release."
              exit 1
            fi
            LAST_VERSION="${LAST_TAG#v}"
            echo "Last tag: $LAST_TAG (version $LAST_VERSION)"

            # Patch bump: increment the last numeric segment.
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
            PATCH=$((PATCH + 1))
            TARGET_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Patch-bumped to: $TARGET_VERSION"
          fi

          echo "target_version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "Target version: $TARGET_VERSION"

      - name: Sync version in package.json + package-lock.json
        run: |
          set -euo pipefail
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"
          # npm version edits package.json AND package-lock.json in place
          # without creating a git tag. Both are committed below so re-runs at
          # the same version never hit an empty-commit failure.
          npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version
          echo "Synced package.json + package-lock.json to $TARGET_VERSION"

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The pin is the nightly's own validated bytes, so the release ships the
      # exact digest that evidence proves.
      - name: Download the promoted image pin
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vercel-image-pin-${{ github.run_id }}
          path: dist

      - name: Validate Vercel image pin
        run: npm run validate:release

      # --- Publish ------------------------------------------------------------
      # PUBLISH BEFORE TAG/RELEASE. If this step fails, the tag and GitHub
      # Release are never created, so there is no release pointing at an
      # unpublished version.
      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"
          [[ "${GITHUB_REF_NAME}" == "${{ github.event.repository.default_branch }}" ]] || {
            echo 'a stable release may only be cut from the default branch' >&2
            exit 1
          }
          echo "Publishing @gannonh/devbox@$TARGET_VERSION to latest"
          npm publish --access public --tag latest

      # --- Commit, tag, and GitHub Release ------------------------------------
      # Only after publish succeeds (or dry_run). Each step gates on the
      # previous step's success() so a publish failure leaves no tag/release.
      - name: Commit version bump and create tag
        id: tag
        if: ${{ success() && github.event.inputs.dry_run != true }}
        run: |
          set -euo pipefail
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git commit -m "chore(release): v${TARGET_VERSION}"
          git tag "v${TARGET_VERSION}"
          git push origin HEAD:main
          git push origin "v${TARGET_VERSION}"
          echo "Pushed commit + tag v${TARGET_VERSION}"
          echo "tag=v${TARGET_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ success() && github.event.inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"
          cat > /tmp/release-notes.md <<'EOF'
          ## Install

          ```sh
          npx @gannonh/devbox init
          ```

          or

          ```sh
          npm install -g @gannonh/devbox
          devbox init
          ```
          EOF
          gh release create "v${TARGET_VERSION}" \
            --title "v${TARGET_VERSION}" \
            --notes-file /tmp/release-notes.md
          echo "Created GitHub Release v${TARGET_VERSION}"

      - name: Dry-run summary
        if: ${{ github.event.inputs.dry_run == true }}
        run: |
          TARGET_VERSION="${{ steps.version.outputs.target_version }}"
          echo "::notice::Dry run complete. Would have published @gannonh/devbox@$TARGET_VERSION, created tag v${TARGET_VERSION}, and a GitHub Release."
